name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Frappe v${{ matrix.frappe }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keyless supports Frappe 15 and 16 (pyproject.toml). The browser suite runs
          # once, on 16; it exercises the front end, which is the same on both.
          - frappe: "16"
            python: "3.14"
            node: 24
            browser: true
          - frappe: "15"
            python: "3.11"
            node: 20
            browser: false

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=10
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install bench
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client
          pip install frappe-bench
          npm install -g yarn
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Set up bench and site
        working-directory: /home/runner
        run: |
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-${{ matrix.frappe }} --python "$(which python)" frappe-bench
          cd frappe-bench
          bench get-app keyless "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin --mariadb-user-host-login-scope='%' test_site
          bench --site test_site install-app keyless
          bench --site test_site set-config allow_tests true
          # The break-glass tests sign in as Administrator with this password.
          bench --site test_site set-config admin_password admin
          bench build
        env:
          CI: "Yes"

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site run-tests --app keyless
        env:
          CI: "Yes"

      # Real Chromium with a virtual WebAuthn authenticator against a running site; see
      # e2e/README.md. A *.localhost site name resolves to this machine in Chromium.
      - name: Set up browser test site
        if: matrix.browser
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site --db-root-password root --admin-password admin --mariadb-user-host-login-scope='%' e2e.localhost
          bench --site e2e.localhost install-app keyless
          bench --site e2e.localhost set-config allow_tests true
          # Set before the server starts, which may not reread site_config mid-run:
          # emailed links and the passkey origin need the port, and mail must stay
          # in the queue (the site has no outgoing account).
          bench --site e2e.localhost set-config host_name http://e2e.localhost:8000
          bench --site e2e.localhost set-config mute_emails 1
          (bench serve --port 8000 > /tmp/bench-serve.log 2>&1 &)
          cd apps/keyless/e2e
          npm ci
          npx playwright install --with-deps chromium
          for i in $(seq 60); do curl -sf -o /dev/null http://e2e.localhost:8000/keyless/login && exit 0; sleep 2; done
          cat /tmp/bench-serve.log
          exit 1
        env:
          CI: "Yes"

      - name: Run browser tests
        if: matrix.browser
        working-directory: /home/runner/frappe-bench/apps/keyless/e2e
        run: node run.js
        env:
          KEYLESS_E2E_BENCH: /home/runner/frappe-bench

      - name: Upload browser screenshots
        if: matrix.browser && failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: |
            /home/runner/frappe-bench/apps/keyless/e2e/screenshots
            /tmp/bench-serve.log
