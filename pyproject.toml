[project]
name = "keyless"
authors = [
    { name = "Grynn GmbH", email = "deepak.pai@grynn.in" },
]
description = "Passwordless accounts for the Frappe Framework — passkeys, magic links, and email OTP."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "webauthn>=2.1.0,<3",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project.urls]
Homepage = "https://github.com/grynn-in/keyless"
Repository = "https://github.com/grynn-in/keyless.git"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["E501", "B904"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
